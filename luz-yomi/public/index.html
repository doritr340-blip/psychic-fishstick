<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6A5AE0"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-180.png"><link rel="icon" href="/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="לו״ז יומי"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>לו״ז יומי</title>
<style id="app-css">
:root{
  /* Layout: a Notion-style page. One reading column of blocks, property rows, database lists; tabs pinned to the bottom */
  --bg:#F5F4FB;--fg:#26243A;--fg-2:#67647D;--fg-3:#9E9BB2;--line:#E7E5F1;--hover:#EFEDF8;--sheet:#FFFFFF;--bar:#FFFFFF;--card:#FFFFFF;
  --blue:#6A5AE0;--blue-ink:#5442C9;--on-blue:#FFFFFF;--danger:#C2453D;--ok:#1E8A71;--scrim:rgba(30,26,60,.42);--knob:#FFFFFF;--shadow:rgba(52,44,110,.16);--sh-s:rgba(52,44,110,.07);
  --hero-a:#6A5AE0;--hero-b:#9A8CF5;
  --tag-fg:#26243A;
  --t-grey:#EEEDF3;--t-brown:#F3E8DF;--t-orange:#FFE7D6;--t-yellow:#FFF1C9;--t-green:#DDF3EA;--t-blue:#DDEBFF;--t-purple:#E8E3FF;--t-pink:#FFE1EC;--t-red:#FFE0DC;
  --c-grey:#F0EFF7;--c-blue:#EDEAFF;--c-yellow:#FFF5E3;--c-green:#E6F6F0;
  --peach:#FFEDE5;--calm:#E6F6F0;--partial:#F0B44C;
  --tv-bg:#EDEAFF;--tv:#6A5AE0;--tm-bg:#DFF5EC;--tm:#1E8A71;--tc-bg:#FFE8E1;--tc:#D9603F;--ts-bg:#E1EEFF;--ts:#3D73C9;--ta-bg:#FFF2D6;--ta:#B7801B;--tg-bg:#EEEDF3;--tg:#67647D;
  --font:"Fredoka","Fredoka Variable",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --nav-h:4.1rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14131C;--fg:#ECEAF6;--fg-2:#A9A6BE;--fg-3:#75728A;--line:#2D2B3C;--hover:#262536;--sheet:#1E1D2A;--bar:#1B1A26;--card:#1E1D2A;
  --blue:#6A5BE2;--blue-ink:#B4AAFF;--on-blue:#FFFFFF;--danger:#F08A80;--ok:#3DBB98;--scrim:rgba(0,0,0,.6);--knob:#F0EEF8;--shadow:rgba(0,0,0,.5);--sh-s:rgba(0,0,0,.28);
  --hero-a:#4C3FBF;--hero-b:#7666E6;
  --tag-fg:#ECEAF6;
  --t-grey:#2E2D3B;--t-brown:#3E332C;--t-orange:#4A3426;--t-yellow:#463C22;--t-green:#203F36;--t-blue:#22334F;--t-purple:#332C55;--t-pink:#46283A;--t-red:#4A2A28;
  --c-grey:#22212F;--c-blue:#25223F;--c-yellow:#2E2819;--c-green:#1B2C27;
  --peach:#2C2228;--calm:#1B2C27;--partial:#B58A3C;
  --tv-bg:#2E2950;--tv:#B4AAFF;--tm-bg:#1C3530;--tm:#6FD6B4;--tc-bg:#3D2722;--tc:#FF9F85;--ts-bg:#1F2F48;--ts:#8DB8FF;--ta-bg:#3A3020;--ta:#F2C266;--tg-bg:#2A2937;--tg:#A9A6BE;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14131C;--fg:#ECEAF6;--fg-2:#A9A6BE;--fg-3:#75728A;--line:#2D2B3C;--hover:#262536;--sheet:#1E1D2A;--bar:#1B1A26;--card:#1E1D2A;
  --blue:#6A5BE2;--blue-ink:#B4AAFF;--on-blue:#FFFFFF;--danger:#F08A80;--ok:#3DBB98;--scrim:rgba(0,0,0,.6);--knob:#F0EEF8;--shadow:rgba(0,0,0,.5);--sh-s:rgba(0,0,0,.28);
  --hero-a:#4C3FBF;--hero-b:#7666E6;
  --tag-fg:#ECEAF6;
  --t-grey:#2E2D3B;--t-brown:#3E332C;--t-orange:#4A3426;--t-yellow:#463C22;--t-green:#203F36;--t-blue:#22334F;--t-purple:#332C55;--t-pink:#46283A;--t-red:#4A2A28;
  --c-grey:#22212F;--c-blue:#25223F;--c-yellow:#2E2819;--c-green:#1B2C27;
  --peach:#2C2228;--calm:#1B2C27;--partial:#B58A3C;
  --tv-bg:#2E2950;--tv:#B4AAFF;--tm-bg:#1C3530;--tm:#6FD6B4;--tc-bg:#3D2722;--tc:#FF9F85;--ts-bg:#1F2F48;--ts:#8DB8FF;--ta-bg:#3A3020;--ta:#F2C266;--tg-bg:#2A2937;--tg:#A9A6BE;
  color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font:400 1.0625rem/1.6 var(--font);-webkit-text-size-adjust:100%}
html.locked,html.locked body{overflow:hidden}
#app{max-width:44rem;margin-inline:auto;padding-inline:20px;padding-block:8px calc(var(--nav-h) + 6.5rem)}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
.sub{color:var(--fg-2)}
.sm{font-size:.9rem}
#view{display:flex;flex-direction:column;gap:10px}

.page-icon{font-size:3.25rem;line-height:1.15;margin-top:1.25rem}
.page-title{font-size:2.25rem;font-weight:700;line-height:1.2;margin-top:.3rem;text-wrap:balance;overflow-wrap:anywhere}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:.3rem}
.title-row .page-title{margin:0}
.h2{font-size:1.45rem;font-weight:600;line-height:1.3;margin-top:1.1rem;text-wrap:balance}
.h3{font-size:1.1rem;font-weight:600;margin-top:.7rem}
.sec-h{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;margin-top:1.1rem}
.sec-h .h2{margin:0}
.sec-h[id]{scroll-margin-top:12px}
.sec-meta{color:var(--fg-2);font-size:.9rem}
.grp{font-size:.85rem;font-weight:600;color:var(--fg-2);margin-top:.35rem;letter-spacing:.01em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:12px;border:1px solid transparent;font-weight:500;font-size:1rem;background:var(--hover);color:var(--fg);text-align:center}
.btn svg{width:18px;height:18px;flex:none}
.btn.blue{background:var(--blue);color:var(--on-blue)}
.btn.quiet{background:transparent;color:var(--fg-2)}
.btn.quiet:hover{background:var(--hover);color:var(--fg)}
.btn.block{width:100%;min-height:48px}
.btn.sq{width:42px;padding:0;font-size:1.3rem}
.btn.danger-quiet{background:transparent;color:var(--danger);align-self:flex-start;padding:0 8px}
.btn[disabled]{opacity:.6;cursor:default}
.link{background:none;border:0;padding:0;color:var(--blue-ink);font-weight:500;text-decoration:underline;text-underline-offset:3px;min-height:32px;text-align:start}
.links{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:4px}

.callout{display:flex;gap:10px;align-items:flex-start;padding-block:14px;padding-inline:14px 16px;border-radius:16px;background:var(--card);box-shadow:0 1px 2px var(--sh-s),0 4px 14px var(--sh-s);color:var(--fg);border:0;text-align:start;width:100%}
.callout.blue{background:var(--c-blue)}
.callout.yellow{background:var(--c-yellow)}
.callout.as-btn:hover{filter:brightness(.98)}
.ci{font-size:1.3rem;line-height:1.5;flex:none}
.cb{min-width:0;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.c-label{font-size:.8rem;font-weight:600;color:var(--fg-2);letter-spacing:.01em}
.c-title{font-size:1.25rem;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.c-title .tnum{margin-inline-end:6px}
.c-cheer{font-size:1.15rem;font-weight:500;line-height:1.55;text-wrap:pretty}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols.one{grid-template-columns:1fr}
@media (max-width:23rem){.cols{grid-template-columns:1fr}}
.col-block{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.col-h{font-weight:600}
.stat{display:flex;align-items:baseline;gap:6px;margin-top:4px}
.stat b{font-size:2rem;font-weight:700;line-height:1.1}
.stat .of{color:var(--fg-2);font-size:1.05rem}
.stat-text{margin-top:4px}
.row-btns{display:flex;gap:6px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.meter{display:block;height:6px;border-radius:99px;background:var(--hover);overflow:hidden;margin:4px 0}
.meter span{display:block;height:100%;background:var(--blue);border-radius:inherit}

.todos,.loops,.db,.goals{list-style:none;margin:0;padding:0}
.todo,.goal{display:flex;align-items:center;gap:2px}
.cbx{width:44px;height:44px;flex:none;display:grid;place-items:center;background:none;border:0;padding:0}
.box{width:24px;height:24px;border:2px solid var(--fg-3);border-radius:50%;display:grid;place-items:center;color:transparent}
.box svg{width:15px;height:15px}
.cbx[aria-checked="true"] .box{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.todo-main{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;min-height:44px;padding:6px;border:0;border-radius:6px;background:none;text-align:start;color:var(--fg)}
.todo-main:hover,.goal-main:hover{background:var(--hover)}
.todo-time{color:var(--fg-2);font-weight:500;min-width:3.1rem}
.todo-title{font-weight:500;overflow-wrap:anywhere}
.todo.now .todo-main{background:var(--c-blue)}
.todo.past .todo-title,.todo.past .todo-time{color:var(--fg-3)}
.todo.done .todo-title{text-decoration:line-through;color:var(--fg-3)}
.todo.done .todo-time{color:var(--fg-3)}
.loop{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;width:100%;padding:8px 6px;min-height:48px;background:none;border:0;border-radius:6px;text-align:start;color:var(--fg)}
.loop:hover{background:var(--hover)}
.loop-title{font-weight:500}
.loop .sub{flex-basis:100%}

.goal-main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;min-height:44px;padding:6px;border:0;border-radius:6px;background:none;text-align:start;color:var(--fg)}
.goal-title{font-weight:500;overflow-wrap:anywhere}
.goal-prog{font-size:.88rem;color:var(--fg-2)}
.goal .meter{width:100%;max-width:15rem;margin:3px 0 1px}
.goal.done .goal-title{color:var(--fg-2)}
.goal.done.simple .goal-title{text-decoration:line-through;color:var(--fg-3)}
.goal.done .meter span{background:var(--ok)}
.g-plus{width:44px;height:44px;flex:none;border-radius:50%;border:1.75px solid var(--blue);background:transparent;color:var(--blue-ink);display:grid;place-items:center;padding:0}
.g-plus svg{width:20px;height:20px}
.goal.done .g-plus{background:var(--ok);border-color:var(--ok);color:var(--on-blue)}

.pill{display:inline-block;padding:0 9px;border-radius:99px;font-size:.85rem;line-height:1.55rem;color:var(--tag-fg);white-space:nowrap;font-weight:400}
.t-grey{background:var(--t-grey)}.t-brown{background:var(--t-brown)}.t-orange{background:var(--t-orange)}.t-yellow{background:var(--t-yellow)}.t-green{background:var(--t-green)}.t-blue{background:var(--t-blue)}.t-purple{background:var(--t-purple)}.t-pink{background:var(--t-pink)}.t-red{background:var(--t-red)}

.views{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;margin-top:.5rem}
.views::-webkit-scrollbar{display:none}
.view-tab{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;min-height:44px;color:var(--fg-2);font-size:.95rem;font-weight:500}
.view-tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.db-row{width:100%;display:grid;grid-template-columns:3.4rem minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 6px;border:0;border-bottom:1px solid var(--line);background:none;text-align:start;min-height:58px;color:var(--fg)}
.db-row:hover{background:var(--hover)}
.db-time{color:var(--fg-2);font-weight:500;display:flex;align-items:center}
.db-time svg{width:18px;height:18px}
.db-main{display:flex;flex-direction:column;min-width:0}
.db-title{font-weight:500;overflow-wrap:anywhere}
.db-meta{font-size:.85rem;color:var(--fg-2);overflow-wrap:anywhere}
.db-new{display:flex;align-items:center;gap:6px;width:100%;padding:10px 6px;min-height:46px;background:none;border:0;border-radius:6px;color:var(--fg-2);text-align:start;font-size:1rem}
.db-new:hover{background:var(--hover);color:var(--fg)}
.db-new svg{width:18px;height:18px}
.empty{color:var(--fg-2);padding:14px 6px;border-bottom:1px solid var(--line)}
.goals-box{border-top:1px solid var(--line)}

.props{display:flex;flex-direction:column}
.prop{display:grid;grid-template-columns:7.25rem minmax(0,1fr);gap:8px;align-items:start;padding:5px 0}
.prop-l{display:flex;align-items:center;gap:6px;color:var(--fg-2);font-size:.95rem;min-height:40px}
.prop-l svg{width:17px;height:17px;flex:none}
.prop-v{min-width:0;display:flex;flex-direction:column;gap:8px;justify-content:center;min-height:40px}
.prop-v.pills{flex-direction:row;flex-wrap:wrap;gap:4px;align-items:center}
.prop-v.range{flex-direction:row;align-items:center;gap:8px;flex-wrap:wrap}
@media (max-width:22.5rem){.prop{grid-template-columns:1fr;gap:0}}
.inp{width:100%;min-height:42px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font-size:1rem}
.inp:hover{background:var(--hover)}
input[type="time"].inp,input[type="date"].inp{direction:ltr;text-align:right;max-width:10rem}
.range .inp{flex:1 1 6.5rem;max-width:8.5rem}
textarea.inp{padding:10px;min-height:10rem;line-height:1.5}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:.95rem}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.seg.days button{min-width:42px;padding:0 6px}
.pill-btn{background:none;border:2px solid transparent;border-radius:6px;padding:3px;min-height:36px}
.pill-btn[aria-pressed="true"]{border-color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:.9rem;color:var(--fg)}
.chip:hover{background:var(--hover)}
.prop-inline{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px}
.stepper{display:flex;align-items:center;gap:10px}
.step-val{min-width:2.5rem;text-align:center;font-size:1.3rem;font-weight:600}

.switch{position:relative;width:46px;height:28px;border-radius:99px;border:0;background:var(--fg-3);padding:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--knob);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:inset-inline-start .16s ease}
.switch[aria-checked="true"]{background:var(--blue)}
.switch[aria-checked="true"]::after{inset-inline-start:21px}

details.toggle{margin-top:.6rem}
details.toggle summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;min-height:44px;font-weight:500;padding:0 4px;border-radius:6px}
details.toggle summary:hover{background:var(--hover)}
details.toggle summary::-webkit-details-marker{display:none}
details.toggle summary::before{content:"◂";color:var(--fg-2);font-size:.85rem;width:1.1em;text-align:center}
details.toggle[open] summary::before{content:"▾"}
.toggle-body{padding-inline-start:28px;padding-block:4px 8px;display:flex;flex-direction:column;gap:8px}

.bullets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.bullet{display:flex;align-items:flex-start;gap:4px}
.bullet::before{content:"•";font-size:1.35rem;line-height:2.15rem;width:1.25rem;text-align:center;flex:none}
.line-in{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);resize:none;padding:6px 4px;border-radius:4px;line-height:1.5;overflow:hidden}
.line-in:hover{background:var(--hover)}
.bullet .pill{margin-top:7px}
.x{width:40px;height:40px;flex:none;border:0;background:none;color:var(--fg-3);border-radius:6px;display:grid;place-items:center}
.x svg{width:16px;height:16px}
.x:hover{background:var(--hover);color:var(--fg)}

.tabs{position:fixed;z-index:20;inset-inline:0;bottom:0;background:var(--bar);border-radius:22px 22px 0 0;box-shadow:0 -2px 22px var(--sh-s);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);max-width:44rem;margin-inline:auto;height:var(--nav-h)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--fg-2);font-size:.78rem;font-weight:500;padding:0 2px;min-width:0}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--blue-ink);font-weight:600}
.tab.home .hb{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,var(--hero-a),var(--hero-b));color:#fff;margin-top:-30px;border:5px solid var(--bg);box-shadow:0 6px 16px var(--shadow)}
.tab.home .hb svg{width:26px;height:26px}
.tab.home[aria-current="page"] .hb{box-shadow:0 6px 18px var(--shadow),0 0 0 2px var(--hero-b)}

.savebar{position:fixed;z-index:21;inset-inline:0;margin-inline:auto;width:min(calc(100% - 24px),40rem);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 10px);background:var(--fg);color:var(--bg);border-radius:10px;padding-block:8px;padding-inline:14px 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:0 8px 28px var(--shadow)}
.savebar p{flex:1 1 10rem;min-width:0;font-weight:500;font-size:.95rem}
.sb-acts{display:flex;gap:6px}
.savebar .btn.quiet,.savebar .btn.quiet:hover{color:var(--bg);background:transparent;border-color:color-mix(in srgb,var(--bg) 35%,transparent)}

.toast{position:fixed;z-index:70;top:calc(env(safe-area-inset-top,0px) + 12px);inset-inline:0;margin-inline:auto;width:max-content;max-width:calc(100% - 32px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.95rem;font-weight:500;box-shadow:0 8px 24px var(--shadow);text-align:center}

.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.scrim.center{align-items:center;padding:16px;z-index:60}
.sheet{background:var(--sheet);width:100%;max-width:44rem;height:94%;border-radius:12px 12px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px var(--shadow)}
.sheet-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.sheet-crumb{color:var(--fg-2);font-size:.9rem;flex:1;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{flex:1;overflow:auto;padding-inline:20px;padding-block:18px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.sheet-body>*,.breath-box>*{flex-shrink:0}
.title-in{width:100%;border:0;background:transparent;color:var(--fg);font-size:1.9rem;font-weight:700;line-height:1.25;resize:none;padding:0;overflow:hidden}
.title-in::placeholder,.body-in::placeholder,.line-in::placeholder{color:var(--fg-3)}
.tpl{display:flex;flex-direction:column;gap:6px}
.divider{height:1px;background:var(--line);margin:6px 0}
.body-in{width:100%;min-height:7rem;border:0;background:transparent;color:var(--fg);resize:none;padding:4px 0;line-height:1.6;overflow:hidden}
.err{color:var(--danger);font-weight:500}
.err:empty{display:none}

תה מייצר את ההרגלים שלך, הם יוצרים את העתיד שלך.","אולי עכשיו זה נראה לך בגדר חלום, אבל חכה קצת. בסוף זה ישתלם.","השלמה אין פירושה ויתור על הרצון, אלא ויתור על הקצב המוטעה שבו ביקשנו שהדברים יקרו.","מכשולים הם הדברים שאנחנו רואים כשאנחנו מסיטים את העיניים מהמטרות שלנו.","בנקודה שבה אתה חושב שנגמר האור, שם הוא מתחיל מחדש.","בדרך לכל הצלחה יש מדרגות, והן שם כדי לחזק את השרירים שלך, כדי שעד שתגיע למעלה, יהיו לך כלים להחזיק ולהכיל את ההצלחה הזאת.","אני לא דואג. יש השם בעולם והוא יודע בדיוק מה הכי עבורי. מה שנכון לי הוא יתברך מקריב לי, ומה שלא מתאים ונכון לו הוא מרחיק ממני, ואני מקבל באהבה ובשמחה. הטוב בעיני השם יתברך קורה לי, ואין יותר טוב לי מכך.","תאמין שאתה יכול ואתה יכול. אמונה היא אחת מממיסי הבעיות החזקים ביותר. כשאתה מאמין שאפשר להתגבר על קושי, אתה כבר יותר מחצי הדרך לניצחון עליו.","שינוי הפרשנות שלך לעבר שלך הוא לעתים קרובות טוב כמו שינוי העבר שלך.","לפעמים אתה לא צריך להיות יותר, אתה פשוט צריך לזכור כמה אתה כבר.","הכוח שלך גדל ברגעים שאתה חושב שאתה לא יכול להמשיך, אבל אתה ממשיך בכל זאת.","לעולם אל תוותרו על עצמכם!","הדרך המהירה ביותר להגיע למצב חדש ומשופר היא לעשות שלום עם המצב הנוכחי שלך.","האויב הכי גדול שלך, אלה המחשבות השליליות שלך.","לפעמים בחיים אתה צריך פשוט להרים את עצמך ולהמשיך הלאה.","תסתכלו קדימה עם תקווה, ולא אחורה עם חרטה.","המחשבה שלנו על הסיטואציה היא זאת שתקבע איך נרגיש, ואיך שאנחנו מרגישים משפיע על איך שנבחר להתנהג."],"by":["","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","",""]},"items":[],"goals":[],"approved":["pressure"],"contentAt":1791529266755}</script>

const DEFAULT_STATE = { v: 3, updatedAt: 0, title: TITLE, name: '', waterGoal: 0, breathMin: 1, showWater: true, showBreath: true, cheers: { on: true, time: '08:30', lines: [], by: [] }, items: [], goals: [], approved: [], program: { title: '', ex: [], prep: '' }, library: [], contentAt: 0 };

/* ---------- scheduling ---------- */
function activeOn(it, d) {
  if (it.until && it.repeat !== 'date' && ymd(d) > it.until) return false;
  if (it.repeat === 'date') return it.date === ymd(d);
  if (it.repeat === 'days') return it.days.includes(d.getDay());

}

}

}

  }

}
const hasTag = tag => state.items.some(it => it.tag === tag);

function dayItems(s, d) {
  const k = ymd(d), mv = ls.get('move:' + k, {}) || {}, sk = ls.get('skip:' + k, []) || [];
  return s.items.filter(it => activeOn(it, d) && !sk.includes(it.id)).map(it => it.mode === 'time' && isT(mv[it.id]) && mv[it.id] !== it.time ? Object.assign({}, it, { time: mv[it.id], movedFrom: it.time }) : it);

/* ---------- goals ---------- */
function weekStart(d) { const x = dayOnly(d); x.setDate(x.getDate() - x.getDay()); return x; }

const gCount = (g, d) => ls.get(gKey(g, d), 0);

}

  if (p === 'week') {

    return `${s.getDate()}.${s.getMonth() + 1} עד ${e.getDate()}.${e.getMonth() + 1} · ${leftText(Math.round((e - t) / 864e5) + 1)}`;
  }

  }

}

    if (canUndo && undoStack.length && !t.querySelector('.toast-act')) { t.insertAdjacentHTML('beforeend', '<button class="toast-act" data-act="undo-save">ביטול</button>'); clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 5000); }

/* ---------- my exercise program: upload, marks, weekly summary ---------- */
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const progEx = () => (draft || state).program.ex;
const pxKey = d => 'px:' + ymd(d);
const PX_LABEL = { f: 'מלא', p: 'חלקי', n: 'לא היום' };
const pxNorm = v => v === 'f' || v === 1 ? 'f' : v === 'p' ? 'p' : v === 'n' || v === 0 ? 'n' : '';
const pxMarks = d => { const m = ls.get(pxKey(d), {}), o = {}; if (m && typeof m === 'object') for (const k in m) { const v = pxNorm(m[k]); if (v) o[k] = v; } return o; };
function moodWeek(start) {
  const a = start.getTime(), b = addDays(start, 7).getTime(), v = jLoad().filter(e => e.mood && e.at >= a && e.at < b).map(e => e.mood);
  return v.length ? v.reduce((x, y) => x + y, 0) / v.length : 0;
}
function goodWeek(start) { let n = 0; for (let k = 0; k < 7; k++) n += +ls.get('good:' + ymd(addDays(start, k)), 0) || 0; return n; }
function pxWeek(start) {
  const ex = progEx(), per = {}; let f = 0, p = 0, n = 0, days = 0;
  ex.forEach(x => { per[x.id] = { f: 0, p: 0, n: 0 }; });
  for (let k = 0; k < 7; k++) {
    const m = pxMarks(addDays(start, k)); let any = false;
    for (const x of ex) { const v = m[x.id]; if (!v) continue; any = true; per[x.id][v]++; if (v === 'f') f++; else if (v === 'p') p++; else n++; }
    if (any) days++;
  }
  return { start, f, p, n, tries: f + p + n, score: f + p / 2, days, per, mood: moodWeek(start), good: goodWeek(start), wins: winsWeek(start) };
}
function pxLine(w, prev) {
  if (!w.tries) return 'השבוע עוד לא סומנו תרגילים.';
  if (!w.f && !w.p) return 'השבוע עוד לא היו תרגילים מלאים או חלקיים. שבוע קשה קורה, ואפשר להתחיל מחדש, אפילו מתרגיל אחד.';
  const a = [];
  if (w.f) a.push(w.f === 1 ? 'תרגיל מלא אחד' : `${w.f} תרגילים מלאים`);
  if (w.p) a.push(w.p === 1 ? (w.f ? 'חלקי אחד' : 'תרגיל חלקי אחד') : (w.f ? `${w.p} חלקיים` : `${w.p} תרגילים חלקיים`));
  let t = (a.length === 2 ? a[0] + (/^\d/.test(a[1]) ? ' ו־' : ' ו') + a[1] : a[0]) + `, ${w.days === 1 ? 'ביום אחד' : 'ב־' + w.days + ' ימים'}.`;
  if (prev && prev.tries) {
    const df = w.f - prev.f, ds = w.score - prev.score;
    t += df > 0 ? ` ${df === 1 ? 'תרגיל מלא אחד' : df + ' תרגילים מלאים'} יותר מהשבוע שעבר.` : ds > 0 ? ' יותר תרגול מהשבוע שעבר.' : ds < 0 ? ' קצת פחות מהשבוע שעבר. שבוע כזה קורה, וכל ניסיון נחשב.' : ' כמו בשבוע שעבר.';
  }
  return t;
}
const weekRange = st => { const e = addDays(st, 6); return `${st.getDate()}.${st.getMonth() + 1}–${e.getDate()}.${e.getMonth() + 1}`; };
function pxExtras(w, prev) {

  if (w.mood) x.push(`מצב הרוח ביומן: ${MOOD_LABEL[Math.round(w.mood)]}${prev && prev.mood ? ` (בשבוע שלפני: ${MOOD_LABEL[Math.round(prev.mood)]})` : ''}`);

}

  return `<div class="px-sum"><p class="c-label">${title} · <bdi>${weekRange(w.start)}</bdi></p><p>${esc(pxLine(w, prev))}</p>${best ? `<p class="sub sm">הכי התקדם: ${esc(best.name)}</p>` : ''}${pxExtras(w, prev).map(x => `<p class="sub sm">${esc(x)}</p>`).join('')}
    ${w.tries ? `<p class="px-legend sub sm"><span class="lg f"></span>מלא<span class="lg p"></span>חלקי</p>` + ex.map(x => { const q = w.per[x.id] || { f: 0, p: 0, n: 0 }; return `<div class="px-ex"><div class="row"><span>${esc(x.name)}</span><span class="sub tnum">${q.f} מלא · ${q.p} חלקי</span></div><span class="meter stack" aria-hidden="true"><span class="f" style="width:${Math.round(q.f / 7 * 100)}%"></span><span class="p" style="width:${Math.round(q.p / 7 * 100)}%"></span></span></div>`; }).join('') : ''}</div>`;

  if (!sub) { push.on = false; ls.set('pushOn', false); push.msg = 'ההתראות הפסיקו לפעול בטלפון הזה. אפשר להפעיל אותן מחדש.'; if (tab === 'settings' || tab === 'today') renderView(); return; }
  apiPost('subscribe', { subscription: sub.toJSON(), data: pushData() }).catch(() => {});
}
function pushBoot() {
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('/sw.js').then(() => pushRefresh()).catch(() => {});
}
function pushBlock() {
  const btn = (act, label, kind) => `<button class="btn ${kind}" data-act="${act}"${push.busy ? ' disabled' : ''}>${label}</button>`;
  const msg = push.msg ? `<p class="sub sm" role="alert">${esc(push.msg)}</p>` : '';
  if (!PUSH_OK) {
    if (isIos() && !isStandalone()) return `<div class="callout yellow"><span class="ci" aria-hidden="true">📲</span><div class="cb"><p>כדי לקבל תזכורות גם כשהטלפון נעול, מוסיפים את האפליקציה למסך הבית:</p><p class="sub sm">1. בספארי לוחצים על כפתור השיתוף (ריבוע עם חץ למעלה).<br>2. בוחרים "הוספה למסך הבית".<br>3. פותחים את האפליקציה מהאייקון החדש וחוזרים לכאן.</p></div></div>`;
    return `<div class="callout"><span class="ci" aria-hidden="true">🔕</span><div class="cb"><p>הדפדפן הזה לא תומך בהתראות.</p><p class="sub sm">באייפון צריך גרסה 16.4 ומעלה, ולפתוח את האפליקציה מהאייקון במסך הבית.</p></div></div>`;
  }
  if (Notification.permission === 'denied') return `<div class="callout yellow"><span class="ci" aria-hidden="true">🔕</span><div class="cb"><p>ההתראות חסומות בטלפון הזה.</p><p class="sub sm">אפשר לאשר אותן בהגדרות של הטלפון: הגדרות, התראות, לו״ז יומי.</p></div></div>`;
  if (push.on) return `<div class="callout green"><span class="ci" aria-hidden="true">🔔</span><div class="cb"><p>התזכורות פועלות בטלפון הזה, גם כשהוא נעול.</p><p class="sub sm">אם התראה לא מגיעה, כדאי לבדוק שמצב ריכוז או "נא לא להפריע" לא משתיקים אותה.</p>${msg}</div></div>
    <div class="row-btns" style="padding-top:0">${btn('push-test', 'שליחת התראת בדיקה', '')}${btn('push-off', 'כיבוי ההתראות', 'quiet')}</div>`;
  return `<p class="sub sm">התזכורות יגיעו בזמן גם כשהטלפון נעול והאפליקציה סגורה.</p>${msg}
    <div class="row-btns" style="padding-top:0">${btn('push-on', push.busy ? 'מפעילים…' : 'הפעלת התראות', 'blue')}</div>`;
}

root.innerHTML = '<main id="view"></main><div id="savebar" class="savebar" role="region" aria-label="שינויים שלא נשמרו" hidden></div><nav id="tabs" class="tabs" aria-label="ניווט"></nav><div id="layer-now"></div><div id="layer-editor"></div><div id="layer-alert"></div><div id="layer-breath"></div><div id="layer-routine"></div><div id="layer-calm"></div><div id="layer-panel"></div><div id="layer-qa"></div><button id="fab" class="fab" data-act="qa-open" aria-label="הוספה מהירה ללו״ז" hidden></button><div id="sndbar" class="sndbar" role="region" aria-label="צליל רקע" hidden></div><div id="savechip" class="savechip" role="status" aria-live="polite" hidden></div><div id="toast" class="toast" role="status" aria-live="polite" hidden></div>';
root.addEventListener('click', onClick);
root.addEventListener('input', onInput);
root.addEventListener('change', onInput);
root.addEventListener('submit', e => { const f = e.target, k = f && f.dataset && f.dataset.form; if (!k) return; e.preventDefault(); if (k === 'qa') qaAdd(); else if (k === 'qs') qsAdd(); else if (k === 'wins') winsAddInput(); });
root.addEventListener('toggle', e => { const d = e.target; if (!d.matches || !d.matches('details.toggle')) return; if (d.dataset.wk) { if (d.open) wkOpen.add(d.dataset.wk); else wkOpen.delete(d.dataset.wk); } else howOpen = d.open; }, true);
document.addEventListener('pointerdown', unlockAudio, true);
document.addEventListener('keydown', onKey);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { tick(); applyWake(); if (snd && ac) { try { ac.resume(); } catch (e) {} } } });

render();
const refit = () => document.querySelectorAll('textarea.line-in, textarea.plan-in, .sheet textarea').forEach(autosize);
try { if (document.fonts) { document.fonts.ready.then(refit); document.fonts.addEventListener('loadingdone', refit); } } catch (e) {}

if (prefs.autoNow && state.items.length) openNow();
if (flash) toast(flash);
pruneOld();
tick();
setInterval(tick, 15000);
applyWake();
pushBoot();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pushRefresh(); });
findVoice();
try { if ('speechSynthesis' in window) window.speechSynthesis.addEventListener('voiceschanged', () => { const had = !!heVoice; findVoice(); if (had !== !!heVoice) { if (tab === 'calm' && !isTyping()) renderView(); if (cp) renderCalm(); } }); } catch (e) {}
})();
